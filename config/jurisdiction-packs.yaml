# Jurisdiction packs for the Digital Security Audit.
#
# Each section is keyed by the newsroom's jurisdiction (set via
# newsroom_profile.metadata.jurisdiction). The audit consults the
# matching pack when scoring each external tool the newsroom has in
# its inventory.
#
# Pack fields:
#   data_law_summary    one-paragraph editorial-facing summary of the
#                       newsroom's home jurisdiction data-protection
#                       regime, used in the audit's narrative.
#   safe_residencies    ISO-2 country codes considered acceptable data
#                       destinations from this jurisdiction.
#   risky_residencies   ISO-2 country codes whose tools should be flagged
#                       (severity 'warn' by default — escalate via
#                       tool_avoid_list if needed).
#   tool_avoid_list     vendor / tool patterns to flag regardless of
#                       residency. Each entry: { vendor? | tool_name?,
#                       severity: 'warn' | 'avoid' | 'prohibit', reason }.
#
# Severity → risk band mapping:
#   safe / no flag → 'low'
#   warn           → 'medium'
#   avoid          → 'high'
#   prohibit       → 'critical'
#
# Per-newsroom overrides live at newsroom_profile.metadata.jurisdiction_overrides
# and merge with the pack at scoring time (allow_list wins; additional
# avoid_list entries append).
#
# Editors should treat this file as a living document — the audit's quality
# is downstream of its quality.

default:
  data_law_summary: >
    No specific jurisdiction set. Treat every external tool conservatively:
    source-protection material should not leave the newsroom's perimeter, and
    third-country residencies (especially state-aligned jurisdictions) warrant
    caution.
  safe_residencies: [EU, GB]
  risky_residencies: [CN, RU, IR, KP]
  tool_avoid_list:
    - tool_name: TikTok
      severity: warn
      reason: ByteDance ownership creates a state-access risk for source material.
    - vendor: DeepSeek
      severity: avoid
      reason: Chinese-origin model with unclear data-handling guarantees.

ZA:
  data_law_summary: >
    POPIA (Protection of Personal Information Act, 2013) governs personal
    information processing in South Africa. Cross-border transfers require
    either consent, contractual safeguards, or an adequate-protection finding.
    The US's FISA 702 regime and Chinese state-access laws are both reasons
    to treat those residencies as risky for source-protection material.
  safe_residencies: [ZA, EU, GB]
  risky_residencies: [US, CN, RU, IR, KP]
  tool_avoid_list:
    - tool_name: TikTok
      severity: warn
      reason: ByteDance ownership creates a state-access risk for source material.
    - vendor: DeepSeek
      severity: avoid
      reason: Chinese-origin model; POPIA cross-border transfer rules and source-protection concerns.
    - vendor: OpenAI
      severity: warn
      reason: US-resident; consider data-residency-tier contract or enterprise plan with EU residency before exposing source-protection material.

ZW:
  data_law_summary: >
    Zimbabwe's Cyber and Data Protection Act (2021) governs personal-data
    processing and cross-border transfers. The current political environment
    creates elevated source-protection concerns — even tools resident in
    'safe' jurisdictions may be subject to local subpoena requests if the
    vendor has a Zimbabwean entity. Local-only processing is preferred for
    high-sensitivity work.
  safe_residencies: [EU, GB, ZA]
  risky_residencies: [US, CN, RU, IR, KP]
  tool_avoid_list:
    - tool_name: TikTok
      severity: avoid
      reason: ByteDance ownership + government interest in social-media monitoring locally.
    - vendor: DeepSeek
      severity: avoid
      reason: Chinese-origin model; source-protection concerns.
    - vendor: OpenAI
      severity: warn
      reason: US-resident; FISA 702 scope of data access.

ZM:
  data_law_summary: >
    Zambia's Data Protection Act (No. 3 of 2021) governs personal-data
    processing and cross-border transfers. Similar source-protection concerns
    to ZW apply — prefer local processing for high-sensitivity work and treat
    US / CN residencies as carrying elevated risk.
  safe_residencies: [EU, GB, ZA]
  risky_residencies: [US, CN, RU, IR, KP]
  tool_avoid_list:
    - tool_name: TikTok
      severity: warn
      reason: ByteDance ownership; state-access risk for source material.
    - vendor: DeepSeek
      severity: avoid
      reason: Chinese-origin model; source-protection concerns.

KE:
  data_law_summary: >
    Kenya's Data Protection Act (2019) governs personal-data processing and
    cross-border transfers, administered by the Office of the Data Protection
    Commissioner (ODPC). Cross-border transfers to non-adequate jurisdictions
    require contractual safeguards. Treat US / CN tools as warranting an
    explicit data-transfer impact assessment for source-protection material.
  safe_residencies: [EU, GB, KE]
  risky_residencies: [CN, RU, IR, KP]
  tool_avoid_list:
    - tool_name: TikTok
      severity: warn
      reason: ByteDance ownership creates state-access risk.
    - vendor: DeepSeek
      severity: avoid
      reason: Chinese-origin model; source-protection concerns.
    - vendor: OpenAI
      severity: warn
      reason: US-resident; consider whether a Kenyan-DPA-aligned contract is in place.

EU:
  data_law_summary: >
    GDPR governs personal-data processing in the EU. Cross-border transfers
    to non-adequate countries require either Standard Contractual Clauses or
    a transfer-impact assessment. The Schrems II ruling specifically tightened
    the bar on US-resident processors handling EU personal data.
  safe_residencies: [EU, GB]
  risky_residencies: [CN, RU, IR, KP]
  tool_avoid_list:
    - vendor: DeepSeek
      severity: avoid
      reason: Chinese-origin model; cross-border transfer concerns.
    - tool_name: TikTok
      severity: warn
      reason: ByteDance ownership; ongoing EU regulatory scrutiny.
    - vendor: OpenAI
      severity: warn
      reason: US-resident processor; Schrems II implications for any personal-data flow.

US:
  data_law_summary: >
    No comprehensive federal data-protection regime; state-level rules
    (notably California's CCPA / CPRA) apply to consumer personal information.
    Foreign-vendor residencies in adversary jurisdictions carry national-security
    review risks; CN-resident tools are increasingly restricted on federal devices.
  safe_residencies: [US, EU, GB, CA]
  risky_residencies: [CN, RU, IR, KP]
  tool_avoid_list:
    - vendor: DeepSeek
      severity: avoid
      reason: Chinese-origin model; data-handling under PRC law unclear.
    - tool_name: TikTok
      severity: warn
      reason: ByteDance ownership; ongoing federal restrictions on government devices.
