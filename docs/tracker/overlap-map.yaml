    imported_as: ai_lawsuits
    grounded_equivalent: [tracker_use_cases, tracker_relationships, learning_updates]
    overlap: high
    collision: false
    action: dedupe-later
    status: deferred
    note: >
      GROUNDED's tracker_* tables + learning_updates are a lighter Next-native
      reimplementation of this. ai_lawsuits is the real backing store.
      Later: make the imported tables canonical, retire the shell or repoint it.
  - table: ai_lawsuit_events
