# Tracker ⇄ GROUNDED overlap map
# ─────────────────────────────────────────────────────────────────────────
# Machine-readable catalogue of where the imported Tracker schema (the legacy
# "AI Legal" app — the prior brand is retired) overlaps GROUNDED's existing
# schema. Generated during the Hub/Tracker/Nodes integration planning pass
# (2026-05-22). Decision: import EVERYTHING from the Tracker app, but defer
# reconciliation — flag the overlaps here so a later Claude Code pass can
# dedupe table-by-table without re-discovering them.
#
# NAMING (no legacy branding survives anywhere):
#   - AI-Legal core tables (ai_*, ai_legal_*) import AS-IS — verified zero
#     name collision with GROUNDED's 70 tables.
#   - CRM / operational tables import under a `tracker_` prefix. This resolves
#     the only hard collision (`funders`) and namespaces them under the
#     Tracker pillar without clashing with the existing tracker_use_cases /
#     tracker_relationships / tracker_digests shell tables.
#   - The Tracker app's own `migrations` table is NEVER imported (GROUNDED's
#     db/migrate.js owns public.migrations).
#   - AI-Legal reference data (lawsuits/regulations/usecases) is GLOBAL
#     (newsroom_id IS NULL), matching GROUNDED's cohort-wide tracker_digests
#     precedent. CRM/operator tables get a newsroom_id when reconciled.
#
# overlap:  none | low | medium | high
# action:   keep-separate | dedupe-later | merge-into-grounded | drop | do-not-import
# status:   deferred  (nothing is reconciled yet; this is a backlog)
# ─────────────────────────────────────────────────────────────────────────

version: 2
generated: 2026-05-22
maintainer: paul@developai.co.za
naming:
  ai_legal_core: as-is        # ai_*, ai_legal_* — no collision
  crm: tracker_ prefix        # e.g. funders -> tracker_funders
do_not_import:
  - migrations                # collides with GROUNDED public.migrations (db/migrate.js)

# ── AI Legal core (the public Tracker — the "great front" data) ────────────
# Imported as-is (no prefix); these names are already unique in GROUNDED.
ai_legal_core:
